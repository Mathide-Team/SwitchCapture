      <stop offset="100%" stop-color="#12838a"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- Châssis du switch -->
  <rect x="18" y="70" width="92" height="28" rx="5"
        fill="#0e2536" stroke="#dce8ec" stroke-width="2"/>
  <!-- Ports / LEDs -->
  <rect x="27" y="80" width="7" height="8" rx="1.5" fill="#33495c"/>
  <rect x="37" y="80" width="7" height="8" rx="1.5" fill="#37e2a8"/>
  <rect x="47" y="80" width="7" height="8" rx="1.5" fill="#33495c"/>
  <rect x="57" y="80" width="7" height="8" rx="1.5" fill="#33495c"/>
  <rect x="67" y="80" width="7" height="8" rx="1.5" fill="#37e2a8"/>
  <rect x="77" y="80" width="7" height="8" rx="1.5" fill="#33495c"/>
  <rect x="87" y="80" width="7" height="8" rx="1.5" fill="#33495c"/>
  <rect x="97" y="80" width="7" height="8" rx="1.5" fill="#33495c"/>

  <!-- Loupe de capture -->
  <circle cx="50" cy="46" r="21" fill="rgba(255,255,255,0.07)"
