  <!-- Paquet capturé, dans la loupe -->
  <circle cx="50" cy="46" r="10" fill="none" stroke="#37e2a8" stroke-width="2" opacity="0.55"/>
  <circle cx="50" cy="46" r="4.5" fill="#37e2a8"/>
